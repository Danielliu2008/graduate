<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - 访问错误</title>
    <style>
        body {
            background: #0B0B0D;
            color: #C5A059;
            font-family: "Georgia", serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 { font-size: 80px; margin: 0; opacity: 0.5; }
        p { letter-spacing: 0.3em; text-transform: uppercase; margin-bottom: 20px; }
        .line { width: 40px; height: 1px; background: #C5A059; opacity: 0.3; }
        .link { color: #C5A059; text-decoration: none; border-bottom: 1px solid #C5A059; margin-top: 40px; font-size: 14px; }
    </style>
</head>
<body>
    <h1>404</h1>
    <div class="line"></div>
    <p>内容未找到或链接已过期</p>
    <a href="javascript:history.back()" class="link">返回上一页</a>
</body>
</html>

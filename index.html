<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>时光信封 | Graduation Letter</title>
    <!-- APlayer CSS - Using stable CDN for China -->
    <link rel="stylesheet" href="https://npm.elemecdn.com/aplayer/dist/APlayer.min.css">
  </head>
  <body class="bg-night">
    <!-- Decorative SVG Patterns -->
    <div class="decorations pointer-events-none fixed inset-0 overflow-hidden z-0 opacity-20">
      <div class="decor-corner decor-tl">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M0 0C50 0 100 50 100 100M0 20C40 20 80 60 80 100M0 40C30 40 60 70 60 100" stroke="var(--color-gold)" stroke-width="0.5"/>
        </svg>
      </div>
      <div class="decor-corner decor-br">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M100 100C50 100 0 50 0 0M100 80C60 80 20 40 20 0M100 60C70 60 40 30 40 0" stroke="var(--color-gold)" stroke-width="0.5"/>
        </svg>
      </div>
    </div>

    <div id="root"></div>
    <!-- APlayer JS - Using stable CDN for China -->
    <script src="https://npm.elemecdn.com/aplayer/dist/APlayer.min.js"></script>
    <script>
      (function() {
        const params = new URLSearchParams(window.location.search);
        const token = params.get('t');
        
        // 关键逻辑：如果 URL 没有 ?t=... 则跳转 404
        if (!token) {
          window.location.href = '404.html';
          return;
        }

        // 动态加载 token 脚本：例如 ?t=123 就会加载 123.js
        const script = document.createElement('script');
        script.src = token + '.js';
        script.async = false;
        script.onerror = function() {
          console.error('Failed to load content for token:', token);
          window.location.href = '404.html';
        };
        document.head.appendChild(script);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
